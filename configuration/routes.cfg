[contacts_general]
description = "List with all contacts (without persons)"
brick = "forms contacts-general"
group = "read"
menu = content
menu_title = "Organisations"
menu_description = "Clubs, companies and institutions"
menu_priority = 7

[contacts_persons]
description = "List with all persons"
brick = "forms persons"
group = "read and write"
menu = content
menu_title = "Persons"
menu_description = "Names, roles, photos and contact details"
menu_priority = 8

[contacts_places]
description = "List with all contacts that are places"
brick = "forms places"
group = "read"

[contacts_profile]
description = "Profile page of a contact"
brick = "request contact *"
expand = scope
include_access[] = contacts_profile

[contacts_relations]
description = "List of contacts related to a contact"
brick = "forms contacts-contacts *"
expand = scope
group = "read and write"

[contacts_verification]
description = "Confirm an e-mail address (double opt-in)"
brick = "make contactverification"
group = public
